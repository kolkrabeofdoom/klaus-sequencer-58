name: Rust CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Format, test and lint
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89
          components: rustfmt, clippy

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  windows-build:
    name: Build Windows release
    runs-on: windows-latest
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2

      - name: Build release executable
        run: cargo build --release --locked

      - name: Stage executable
        shell: pwsh
        run: Copy-Item target/release/klaus-sequencer-58.exe KLAUS-Sequencer-58-Windows-x64.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: KLAUS-Sequencer-58-Windows-x64
          path: KLAUS-Sequencer-58-Windows-x64.exe
          if-no-files-found: error
