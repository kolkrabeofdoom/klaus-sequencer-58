[package]
name = "klaus-sequencer-58"
version = "0.6.2"
edition = "2024"
rust-version = "1.89"
description = "K.L.A.U.S. Sequencer 58 – polyphonic cosmic MIDI step sequencer"
license = "AGPL-3.0-or-later"

[lib]
name = "klaus_sequencer_58"
path = "src/lib.rs"

[[bin]]
name = "klaus-sequencer-58"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
image = { version = "0.25.8", default-features = false, features = ["png"] }
midir = "0.11.1"
rfd = "0.15.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

